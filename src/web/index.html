<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scout Local Search</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/marked.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><span class="mark">S</span><span>Scout</span></div>
      <div class="status"><span id="dot" class="dot"></span><span id="status">Connecting</span></div>
    </header>
    <main>
      <section class="intro">
        <h1>Ask your local library.</h1>
        <p>Answers are generated from documents indexed on this machine, with cited sources.</p>
      </section>
      <section id="messages" aria-live="polite"></section>
    </main>
    <footer>
      <form id="upload-form" class="upload-form">
        <div class="upload-fields">
          <label class="file-picker">Files <input id="files" type="file" multiple required accept=".md,.markdown,.txt,.rst,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.odt,.ods,.odp"></label>
          <label>Collection <input id="collection" value="default" required></label>
          <button id="upload" type="submit">Ingest files</button>
        </div>
        <div id="upload-status" class="upload-status" aria-live="polite"></div>
      </form>
      <form id="chat-form">
        <div class="settings">
          <label>Collection <select id="search-collection" aria-label="Search collection"><option value="">All collections</option></select></label>
          <label>Mode <select id="mode" aria-label="Search mode"><option value="hybrid">Hybrid</option><option value="vector">Vector</option><option value="fts">Full text</option></select></label>
          <button id="clear" type="button" class="ghost">Clear</button>
        </div>
        <div class="controls">
          <textarea id="question" placeholder="Ask about your indexed documents" aria-label="Question" required></textarea>
          <button id="send" type="submit">Ask</button>
        </div>
      </form>
    </footer>
  </div>
</body>
</html>
